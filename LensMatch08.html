<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鏡界 LensMatch - 專業攝影師接案平台 | 攝影媒合與作品集展示</title>
    
    <meta name="description" content="鏡界 LensMatch 是台灣專業的攝影媒合與雲端同步平台。提供商業攝影、活動紀錄、婚禮紀錄、人像寫真與短影音剪輯等案源，協助攝影師與案主快速對接，建立透明口碑排行榜。">
    <meta name="keywords" content="攝影接案,攝影師媒合,商業攝影,活動紀錄,婚禮紀錄,人像寫真,短影音剪輯,找攝影師,鏡界,LensMatch">
    <meta name="author" content="鏡界 LensMatch 團隊">
    
    <meta property="og:title" content="鏡界 LensMatch - 專業攝影師接案平台">
    <meta property="og:description" content="專業攝影媒合與雲端同步平台，尋找優質攝影師或發布拍攝案件首選。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://xxxxmultiple.github.io/X/cover.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        // 初始化 EmailJS Public Key
        (function(){
            emailjs.init("Nic3c4Gw6B9aGCu7t");
        })();
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider cursor-pointer">📷 鏡界 LensMatch</h1>
            <div class="flex items-center gap-4">
                <div class="text-xs text-gray-400 hidden sm:block">
                    專業攝影媒合與雲端同步平台
                </div>
                <button onclick="openSupportEmail()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-sm flex items-center gap-1 cursor-pointer">
                    💬 客服中心
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <aside class="md:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit sticky top-20">
                <h2 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">🔐 會員中心</h2>
                
                <div id="login-section">
                    <p class="text-xs text-gray-500 mb-3">首次登入請輸入稱呼與密碼註冊；之後只需輸入 Email 與密碼即可！</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">登入帳號 (請輸入 Email) <span class="text-red-500">*</span></label>
                            <input type="email" id="login-email" placeholder="your@email.com" onblur="checkUserExist()" class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800">
                        </div>
                        
                        <div id="name-field-container" class="hidden">
                            <label class="block text-xs font-semibold text-amber-600 mb-1">✨ 偵測為新帳號，請輸入團隊名稱/稱呼 <span class="text-red-500">*</span></label>
                            <input type="text" id="login-name" placeholder="例如：Ken 影像工作室" class="w-full text-sm px-3 py-2 border border-amber-300 bg-amber-50/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">密碼 <span class="text-red-500">*</span></label>
                            <input type="password" id="login-password" placeholder="請輸入密碼" class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-800">
                        </div>

                        <div class="flex items-center justify-between pt-1 text-xs">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="remember-me" class="w-4 h-4 text-gray-900 border-gray-300 rounded focus:ring-gray-800 cursor-pointer">
                                <label for="remember-me" class="text-gray-600 cursor-pointer select-none">記住帳號密碼</label>
                            </div>
                            <button onclick="openForgotPasswordModal()" class="text-amber-600 hover:underline font-semibold cursor-pointer">忘記密碼？</button>
                        </div>

                        <button onclick="handleLoginOrRegister()" id="auth-btn" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-2 rounded-lg text-sm font-medium transition mt-1">
                            登入 / 註冊
                        </button>
                    </div>
                </div>

                <div id="user-info-section" class="hidden space-y-4">
                    <div class="bg-green-50 p-3 rounded-lg border border-green-200">
                        <p class="text-xs text-green-600 font-semibold mb-1">✅ 已登入會員</p>
                        <p id="user-display-name" class="text-sm font-bold text-gray-900"></p>
                        <p id="user-display-email" class="text-xs text-gray-500 truncate"></p>
                    </div>

                    <button onclick="openPostModal()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-lg text-sm font-bold transition shadow-sm">
                        📝 我要發佈新案件
                    </button>

                    <button onclick="openEditProfileModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1">
                        ⚙️ 修改資料與密碼
                    </button>

                    <button onclick="handleLogout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded-lg text-sm font-medium transition border border-red-200">
                        登出帳號
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="text-base font-bold text-gray-900 mb-2 pb-2 border-b border-gray-100">
                    <span>✍️ 給予接案者評價</span>
                </h3>
                <p class="text-xs text-gray-500 mb-3">與團隊合作過嗎？留下評價協助建立口碑！</p>
                <button onclick="openRatingModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-2 rounded-lg text-xs font-bold transition">
                    撰寫合作評價 🌟
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="text-base font-bold text-gray-900 mb-2 pb-2 border-b border-gray-100 flex items-center justify-between">
                    <span>🏆 接案口碑排行榜</span>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-semibold">Top 20</span>
                </h3>
                <p class="text-[11px] text-gray-400 mb-3">💡 點擊下方名單可查看詳細檔案與評價</p>
                <div id="ranking-container" class="space-y-2 max-h-96 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 text-center py-4">載入排行榜中...</p>
                </div>
            </div>
        </aside>

        <main class="md:col-span-3 space-y-4">
            <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                <h2 class="text-2xl font-bold text-gray-900">📋 最新拍攝案件大廳</h2>
                <span id="hall-status-tip" class="text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-semibold">請先登入以解鎖接案按鈕</span>
            </div>

            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-2 items-center">
                <span class="text-xs font-bold text-gray-500 mr-1">🔍 類別篩選：</span>
                <button onclick="filterCategory('全部', this)" class="filter-btn bg-gray-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">全部案件</button>
                <button onclick="filterCategory('商業攝影', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">商業攝影</button>
                <button onclick="filterCategory('活動紀錄', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">活動紀錄</button>
                <button onclick="filterCategory('婚禮紀錄', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">婚禮紀錄</button>
                <button onclick="filterCategory('人像寫真', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">人像寫真</button>
                <button onclick="filterCategory('自媒體', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">自媒體</button>
                <button onclick="filterCategory('找剪輯', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">找剪輯</button>
                <button onclick="filterCategory('短影音', this)" class="filter-btn bg-gray-100 text-gray-600 hover:bg-gray-200 text-xs px-3 py-1.5 rounded-lg font-medium transition">短影音</button>
            </div>

            <div id="projects-container" class="space-y-4">
                <p class="text-sm text-gray-500 text-center py-6">正在從雲端載入最新案件...</p>
            </div>
        </main>
    </div>

    <div id="registerProfileModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeRegisterProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold cursor-pointer">&times;</button>
            <h3 class="text-xl font-bold text-gray-900 mb-1">✨ 歡迎加入鏡界！請填寫您的工作室檔案</h3>
            <p class="text-xs text-gray-500 mb-4">這些資訊將展示在排行榜與您的專屬檔案頁面中，方便案主認識您！</p>
            
            <div class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">主打服務項目 + 個人介紹</label>
                    <textarea id="reg-services" rows="3" placeholder="例如：專注於商業攝影與婚禮紀錄，擁有5年拍攝經驗..." class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">作品集連結(Google雲端) or其他連結</label>
                    <input type="url" id="reg-portfolio" placeholder="https://drive.google.com/..." class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Instagram (IG) 帳號或連結</label>
                        <input type="text" id="reg-ig" placeholder="例如：username 或完整網址" class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Facebook (FB) 連結</label>
                        <input type="url" id="reg-fb" placeholder="https://facebook.com/..." class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-2 border-t border-gray-100">
                    <input type="checkbox" id="reg-agree-disclaimer" checked class="w-4 h-4 mt-0.5 text-amber-600 border-gray-300 rounded focus:ring-amber-500 cursor-pointer">
                    <label for="reg-agree-disclaimer" class="text-xs text-gray-600 select-none">
                        我已閱讀並同意遵守 <button type="button" onclick="openDisclaimerModal()" class="text-amber-600 font-semibold underline cursor-pointer">《服務條款與免責聲明》</button>
                    </label>
                </div>

                <div class="flex gap-2 pt-2">
                    <button onclick="closeRegisterProfileModal()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-xl font-bold transition shadow-sm cursor-pointer text-xs">
                        🔙 返回取消
                    </button>
                    <button onclick="submitRegisterProfile()" class="w-2/3 bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-bold transition shadow-md cursor-pointer">
                        儲存檔案並進入平台 🚀
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="editProfileModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-
